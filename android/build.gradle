group = "com.example.flutter_biometric"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    ext {
        compileSdkVersion = 35
        minSdkVersion = 23
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.flutter_biometric"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }
}

dependencies {
    // Terminal release of the 1.2.0 line and the minimum exposing
    // AuthenticationResult.getAuthenticationType() (1.1.0 stable lacks it);
    // the 1.4.0 alphas are a newer, higher-churn line. Downgrading to 1.1.0
    // breaks compilation; keep this pinned deliberately.
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
}
